plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
}

dependencies {
    // No external dependencies: everything is done via reflection-based soft compat.
}

neoForge {
    // Target NeoForge version from the request
    version = '21.1.262'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        lagsweep {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
